<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Iniciar sesión — Finanzas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #1e5f8c 0%, #0f8080 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
  }

  h1 {
    font-size: 1.3rem;
    color: #133a4f;
    text-align: center;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #35606f;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e1ecef;
    border-radius: 12px;
    font-size: 1rem;
    color: #133a4f;
    background: #f9fcfd;
  }

  input:focus {
    outline: none;
    border-color: #0f8080;
    background: #ffffff;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1e5f8c, #0f8080);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .mensaje {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .mensaje.error {
    display: block;
    background: #fdecec;
    color: #b3261e;
    border: 2px solid #f5b8b4;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔒 Finanzas</h1>
  <form id="form-login">
    <label for="password">Contraseña</label>
    <input type="password" id="password" required autofocus>
    <button type="submit" id="btn-entrar">Entrar</button>
    <div class="mensaje" id="mensaje"></div>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const destino = params.get('destino') || '/app/transacciones.html';

  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('btn-entrar');
    const mensaje = $('mensaje');
    mensaje.className = 'mensaje';

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('password').value }),
      });

      if (!res.ok) {
        const cuerpo = await res.json().catch(() => ({}));
        throw new Error(cuerpo.error || `HTTP ${res.status}`);
      }

      location.href = destino;
    } catch (err) {
      mensaje.textContent = '❌ ' + err.message;
      mensaje.className = 'mensaje error';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>

</body>
</html>
