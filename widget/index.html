<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Captura Rápida — Finanzas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #1e5f8c 0%, #0f8080 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 420px;
    padding: 28px 24px 32px;
  }

  .card h1 {
    font-size: 1.4rem;
    color: #133a4f;
    text-align: center;
    margin-bottom: 4px;
  }

  .card .subtitle {
    text-align: center;
    color: #6b8794;
    font-size: 0.85rem;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #35606f;
    margin: 14px 0 6px;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e1ecef;
    border-radius: 12px;
    font-size: 1rem;
    color: #133a4f;
    background: #f9fcfd;
    transition: border-color 0.15s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #0f8080;
    background: #ffffff;
  }

  textarea { resize: vertical; min-height: 60px; }

  .montos-rapidos {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .monto-btn {
    flex: 1 1 auto;
    min-width: 64px;
    width: auto;
    padding: 10px 8px;
    border: 2px solid #cfe6e6;
    border-radius: 10px;
    background: #eefaf9;
    color: #0f8080;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .monto-btn:hover, .monto-btn:active {
    background: #0f8080;
    color: #ffffff;
    border-color: #0f8080;
  }

  .monto-btn.activo {
    background: #0f8080;
    color: #ffffff;
    border-color: #0f8080;
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1e5f8c, #0f8080);
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  button[type="submit"]:active { transform: scale(0.98); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .mensaje {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .mensaje.exito {
    display: block;
    background: #e3f7ee;
    color: #157a4b;
    border: 2px solid #a9e6c9;
  }

  .mensaje.error {
    display: block;
    background: #fdecec;
    color: #b3261e;
    border: 2px solid #f5b8b4;
  }

  .campo-doble {
    display: flex;
    gap: 10px;
  }

  .campo-doble > div { flex: 1; }

  .oculto { display: none !important; }

  .msi-box {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f4f9f8;
    border-radius: 10px;
  }

  .msi-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 0.85rem;
    color: #35606f;
    cursor: pointer;
  }

  .msi-check input { width: auto; padding: 0; }

  .msi-box select { margin-top: 8px; }

  @media (max-width: 400px) {
    .card { padding: 22px 16px 26px; border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>💸 Captura Rápida</h1>
  <p class="subtitle">Registra un gasto en segundos</p>

  <form id="form-gasto">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" placeholder="Ej. Café, gasolina, súper..." required>

    <label for="monto">Monto</label>
    <input type="number" id="monto" step="0.01" min="0.01" placeholder="0.00" inputmode="decimal" required>

    <div class="montos-rapidos" id="montos-rapidos">
      <button type="button" class="monto-btn" data-monto="50">$50</button>
      <button type="button" class="monto-btn" data-monto="100">$100</button>
      <button type="button" class="monto-btn" data-monto="500">$500</button>
      <button type="button" class="monto-btn" data-monto="1000">$1000</button>
      <button type="button" class="monto-btn" data-monto="2000">$2000</button>
    </div>

    <div class="campo-doble">
      <div>
        <label for="usuario">Usuario</label>
        <select id="usuario" required>
          <option value="">Cargando...</option>
        </select>
      </div>
      <div>
        <label for="tipo">Tipo</label>
        <select id="tipo" required>
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
      </div>
    </div>

    <div class="campo-doble">
      <div>
        <label for="categoria">Categoría</label>
        <select id="categoria" required>
          <option value="">Cargando...</option>
        </select>
      </div>
      <div>
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
    </div>

    <label for="medio">Medio (cuenta o tarjeta)</label>
    <select id="medio" required>
      <option value="">Cargando...</option>
    </select>

    <div id="msi-box" class="msi-box oculto">
      <label class="msi-check">
        <input type="checkbox" id="usar-msi">
        Meses sin intereses
      </label>
      <select id="msi-meses" class="oculto">
        <option value="3">3 meses</option>
        <option value="6">6 meses</option>
        <option value="9">9 meses</option>
        <option value="12">12 meses</option>
        <option value="18">18 meses</option>
        <option value="20">20 meses</option>
        <option value="24">24 meses</option>
      </select>
    </div>

    <label for="notas">Notas (opcional)</label>
    <textarea id="notas" placeholder="Algo más que quieras anotar..."></textarea>

    <button type="submit" id="btn-guardar">Guardar gasto</button>

    <div class="mensaje" id="mensaje"></div>
  </form>
</div>

<script>
  // ── Configuración de Supabase ─────────────────────────────────────────
  // Reemplaza estos 3 valores con los de tu proyecto de Supabase.
  // Los encuentras en: Supabase → Settings → API
  const SUPABASE_URL = 'https://mehwuyolvfjvmlobcsms.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1laHd1eW9sdmZqdm1sb2Jjc21zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzcyNDEsImV4cCI6MjA5MzE1MzI0MX0.dmZ7OQnQ_VjCIXVguFpvU55L8_JMctGpIqshmudPrE0';
  const USUARIO_ID_DEFECTO = 1;
  // ─────────────────────────────────────────────────────────────────────

  const headersBase = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
  };

  const $ = (id) => document.getElementById(id);
  const mensajeEl = $('mensaje');
  const btnGuardar = $('btn-guardar');

  function mostrarMensaje(texto, tipo) {
    mensajeEl.textContent = texto;
    mensajeEl.className = `mensaje ${tipo}`;
  }

  function ocultarMensaje() {
    mensajeEl.className = 'mensaje';
    mensajeEl.textContent = '';
  }

  // Fecha de hoy por defecto
  $('fecha').valueAsDate = new Date();

  // Botones de montos rápidos
  document.querySelectorAll('.monto-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('monto').value = btn.dataset.monto;
      document.querySelectorAll('.monto-btn').forEach((b) => b.classList.remove('activo'));
      btn.classList.add('activo');
    });
  });
  $('monto').addEventListener('input', () => {
    document.querySelectorAll('.monto-btn').forEach((b) => b.classList.remove('activo'));
  });

  function actualizarVisibilidadMsi() {
    const esTarjeta = $('medio').value.startsWith('tarjeta:');
    $('msi-box').classList.toggle('oculto', !esTarjeta);
    if (!esTarjeta) {
      $('usar-msi').checked = false;
      $('msi-meses').classList.add('oculto');
    }
  }

  $('medio').addEventListener('change', actualizarVisibilidadMsi);
  $('usar-msi').addEventListener('change', () => {
    $('msi-meses').classList.toggle('oculto', !$('usar-msi').checked);
  });

  async function cargarCategorias(tipo) {
    const selectCategoria = $('categoria');
    selectCategoria.innerHTML = '<option value="">Cargando...</option>';
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/categoria?select=id,nombre,icono&tipo=eq.${tipo}&activa=eq.1&order=nombre`,
      { headers: headersBase }
    );
    if (!res.ok) throw new Error('No se pudieron cargar las categorías.');
    const categorias = await res.json();
    selectCategoria.innerHTML = categorias
      .map((c) => `<option value="${c.id}">${c.icono || '📦'} ${c.nombre}</option>`)
      .join('') || '<option value="">Sin categorías</option>';
  }

  async function cargarMedios(usuarioId) {
    const selectMedio = $('medio');
    selectMedio.innerHTML = '<option value="">Cargando...</option>';
    const [cuentasRes, tarjetasRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/cuenta?select=id,nombre&usuario_id=eq.${usuarioId}&activa=eq.1&order=nombre`, { headers: headersBase }),
      fetch(`${SUPABASE_URL}/rest/v1/tarjeta_credito?select=id,nombre,banco&usuario_id=eq.${usuarioId}&activa=eq.1&order=nombre`, { headers: headersBase }),
    ]);
    if (!cuentasRes.ok || !tarjetasRes.ok) throw new Error('No se pudieron cargar las cuentas/tarjetas.');
    const cuentas = await cuentasRes.json();
    const tarjetas = await tarjetasRes.json();
    const opcionesCuentas = cuentas
      .map((c) => `<option value="cuenta:${c.id}">🏦 ${c.nombre}</option>`)
      .join('');
    const opcionesTarjetas = tarjetas
      .map((t) => `<option value="tarjeta:${t.id}">💳 ${t.nombre} (${t.banco})</option>`)
      .join('');
    selectMedio.innerHTML = opcionesCuentas + opcionesTarjetas || '<option value="">Sin cuentas/tarjetas</option>';
    actualizarVisibilidadMsi();
  }

  async function cargarDatos() {
    try {
      const usuariosRes = await fetch(`${SUPABASE_URL}/rest/v1/usuario?select=id,nombre&order=id`, { headers: headersBase });
      if (!usuariosRes.ok) throw new Error('No se pudieron cargar los usuarios.');
      const usuarios = await usuariosRes.json();

      const selectUsuario = $('usuario');
      selectUsuario.innerHTML = usuarios
        .map((u) => `<option value="${u.id}">${u.nombre}</option>`)
        .join('') || '<option value="">Sin usuarios</option>';
      if (usuarios.some((u) => u.id === USUARIO_ID_DEFECTO)) {
        selectUsuario.value = String(USUARIO_ID_DEFECTO);
      }

      await Promise.all([
        cargarCategorias($('tipo').value),
        cargarMedios(selectUsuario.value),
      ]);
    } catch (err) {
      mostrarMensaje('❌ Error al cargar datos: ' + err.message, 'error');
    }
  }

  $('usuario').addEventListener('change', () => {
    cargarMedios($('usuario').value).catch(
      (err) => mostrarMensaje('❌ Error al cargar cuentas/tarjetas: ' + err.message, 'error')
    );
  });

  $('tipo').addEventListener('change', () => {
    cargarCategorias($('tipo').value).catch(
      (err) => mostrarMensaje('❌ Error al cargar categorías: ' + err.message, 'error')
    );
  });

  cargarDatos();

  $('form-gasto').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarMensaje();

    const descripcion = $('descripcion').value.trim();
    const monto = parseFloat($('monto').value);
    const usuarioId = $('usuario').value;
    const tipo = $('tipo').value;
    const categoriaId = $('categoria').value;
    const fecha = $('fecha').value;
    const medio = $('medio').value;
    const notas = $('notas').value.trim();

    if (!descripcion || !monto || monto <= 0 || !usuarioId || !categoriaId || !fecha || !medio) {
      mostrarMensaje('⚠️ Completa todos los campos requeridos.', 'error');
      return;
    }

    const [tipoMedio, medioId] = medio.split(':');
    const esTarjeta = tipoMedio === 'tarjeta';
    const mesesSinIntereses = (esTarjeta && $('usar-msi').checked) ? Number($('msi-meses').value) : 0;
    const montoPorMes = mesesSinIntereses > 0 ? Math.round((monto / mesesSinIntereses) * 100) / 100 : 0;

    const payload = {
      usuario_id: Number(usuarioId),
      cuenta_id: tipoMedio === 'cuenta' ? Number(medioId) : null,
      tarjeta_id: esTarjeta ? Number(medioId) : null,
      categoria_id: Number(categoriaId),
      monto: monto,
      fecha: fecha,
      descripcion: descripcion,
      tipo: tipo,
      notas: notas,
      meses_sin_intereses: mesesSinIntereses,
      monto_por_mes: montoPorMes,
    };

    btnGuardar.disabled = true;
    btnGuardar.textContent = 'Guardando...';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/transaccion`, {
        method: 'POST',
        headers: { ...headersBase, 'Prefer': 'return=minimal' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const detalle = await res.text();
        throw new Error(detalle || `HTTP ${res.status}`);
      }

      mostrarMensaje('✅ ¡Gasto guardado con éxito!', 'exito');
      const usuarioAntes = $('usuario').value;
      $('form-gasto').reset();
      $('fecha').valueAsDate = new Date();
      $('usuario').value = usuarioAntes;
      $('tipo').value = 'gasto';
      document.querySelectorAll('.monto-btn').forEach((b) => b.classList.remove('activo'));
      await cargarCategorias('gasto');
      actualizarVisibilidadMsi();
    } catch (err) {
      mostrarMensaje('❌ Error al guardar: ' + err.message, 'error');
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.textContent = 'Guardar gasto';
    }
  });
</script>

</body>
</html>
