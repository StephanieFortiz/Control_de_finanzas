<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Préstamos — Finanzas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #eef4f6;
    color: #133a4f;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    background: linear-gradient(135deg, #1e5f8c, #0f8080);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 1.1rem; }
  nav a { color: #eaf6f6; text-decoration: none; font-size: 0.85rem; margin-left: 16px; }
  nav a.activo { font-weight: 700; text-decoration: underline; }

  main {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    padding: 20px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #35606f;
    margin: 0 0 5px;
  }

  select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e1ecef;
    border-radius: 10px;
    font-size: 0.95rem;
    color: #133a4f;
    background: #f9fcfd;
  }
  select:focus { outline: none; border-color: #0f8080; background: #fff; }

  .barra-superior { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .barra-superior > div { flex: 1; min-width: 160px; }

  .tabs { display: flex; gap: 8px; margin-top: 18px; border-bottom: 2px solid #eef2f3; }
  .tab-btn {
    padding: 8px 16px; border: none; background: none; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; color: #6b8794; border-bottom: 3px solid transparent;
  }
  .tab-btn.activo { color: #0f8080; border-bottom-color: #0f8080; }

  .metricas { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  .metrica { flex: 1; min-width: 140px; background: #f8f7f4; border-radius: 10px; padding: 12px 14px; }
  .metrica .valor { font-size: 1.2rem; font-weight: 700; }
  .metrica .etiqueta { font-size: 0.75rem; color: #6b8794; }

  .filtro-radio { display: flex; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
  .filtro-radio label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #35606f; cursor: pointer; }
  .filtro-radio input { width: auto; }

  .prestamo-item { border-bottom: 1px solid #eef2f3; padding: 14px 0; }
  .prestamo-fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .prestamo-info { flex: 2; min-width: 200px; }
  .prestamo-cargo { font-weight: 600; font-size: 0.92rem; }
  .prestamo-sub { font-size: 0.75rem; color: gray; margin-top: 2px; }
  .prestamo-montos { display: flex; gap: 18px; flex-wrap: wrap; }
  .prestamo-montos > div { min-width: 70px; }
  .prestamo-montos .valor { font-weight: 600; font-size: 0.92rem; }
  .prestamo-montos .etiqueta { font-size: 0.7rem; color: gray; }
  .resta { color: #E24B4A; }
  .resta.pagado { color: #639922; }

  .barra-progreso { background: #eee; border-radius: 4px; height: 8px; margin-top: 6px; min-width: 100px; }
  .barra-progreso > div { background: #378ADD; height: 8px; border-radius: 4px; }
  .barra-progreso.completa > div { background: #639922; }
  .progreso-texto { font-size: 0.7rem; color: gray; margin-top: 2px; }

  .prestamo-acciones { display: flex; gap: 6px; }
  .prestamo-acciones button { border: none; background: none; cursor: pointer; font-size: 1rem; padding: 4px; }
  .btn-abonar-prestamo {
    font-size: 0.8rem; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #0C447C; background: #fff; color: #0C447C; cursor: pointer;
  }

  .detalle-toggle {
    font-size: 0.78rem; color: #0f8080; background: none; border: none; cursor: pointer;
    margin-top: 8px; padding: 0; text-decoration: underline;
  }
  .detalle-box { margin-top: 10px; padding: 10px 12px; background: #f8fbfc; border-radius: 10px; }

  .pago-fila { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
  .pago-fila .monto { color: #639922; font-weight: 500; }

  .calendario { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  @media (max-width: 600px) { .calendario { grid-template-columns: repeat(2, 1fr); } }
  .mes-msi { text-align: center; background: #F8F7F4; border-radius: 8px; padding: 6px 4px; }
  .mes-msi.pagado { background: #EAF3DE; }
  .mes-msi.condonado { background: #FFF3CD; }
  .mes-msi .num { font-size: 11px; color: gray; }
  .mes-msi .fecha { font-size: 12px; font-weight: 500; }
  .mes-msi .estado { font-size: 11px; }
  .mes-msi.pagado .estado { color: #27500A; }
  .mes-msi.condonado .estado { color: #856404; }
  .mes-msi:not(.pagado):not(.condonado) .estado { color: #E24B4A; }

  .caja-abono {
    border-left: 3px solid #378ADD; padding: 12px 14px 4px; margin: 10px 0 4px;
    background: #f8fbfc; border-radius: 0 8px 8px 0;
  }
  input, select { padding: 10px 12px; border: 2px solid #e1ecef; border-radius: 10px; font-size: 0.9rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .btn-primario {
    padding: 10px 16px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #1e5f8c, #0f8080); color: #fff;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-top: 14px;
  }
  .btn-secundario {
    padding: 10px 16px; border: 2px solid #cfe6e6; border-radius: 10px;
    background: #fff; color: #35606f; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 14px;
  }
  .mensaje {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px;
    font-size: 0.8rem; font-weight: 600; display: none;
  }
  .mensaje.error { display: block; background: #fdecec; color: #b3261e; border: 2px solid #f5b8b4; }

  .vacio { color: #888; font-size: 0.9rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>💳 Finanzas</h1>
  <nav>
    <a href="/app/transacciones.html">📋 Transacciones</a>
    <a href="#" class="activo">🤝 Préstamos</a>
    <a href="https://finanzas-os.streamlit.app" target="_blank" rel="noopener">
      Dashboard · Tarjetas · Configuración (app clásica) ↗
    </a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="barra-superior">
      <div>
        <label for="viendo-como">Viendo como</label>
        <select id="viendo-como"></select>
      </div>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn activo" data-tab="pendientes">📋 Pendientes</button>
      <button type="button" class="tab-btn" data-tab="archivados">📦 Archivados</button>
    </div>

    <div id="tab-pendientes">
      <div class="metricas" id="metricas-pendientes"></div>
      <div class="filtro-radio" id="filtro-direccion">
        <label><input type="radio" name="direccion" value="todos" checked> Todos</label>
        <label><input type="radio" name="direccion" value="debo"> Lo que yo debo</label>
        <label><input type="radio" name="direccion" value="me_deben"> Lo que me deben</label>
      </div>
      <div id="lista-pendientes"></div>
    </div>

    <div id="tab-archivados" class="oculto">
      <div id="lista-archivados"></div>
    </div>
  </section>
</main>

<style>.oculto { display: none !important; }</style>

<script src="/app/_shared.js"></script>
<script src="/app/prestamos.js"></script>
</body>
</html>
