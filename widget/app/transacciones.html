<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transacciones — Finanzas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #eef4f6;
    color: #133a4f;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    background: linear-gradient(135deg, #1e5f8c, #0f8080);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  header h1 { font-size: 1.1rem; }

  nav a {
    color: #eaf6f6;
    text-decoration: none;
    font-size: 0.85rem;
    margin-left: 16px;
  }
  nav a.activo { font-weight: 700; text-decoration: underline; }

  main {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    padding: 20px;
  }

  .card h2 {
    font-size: 1.05rem;
    margin-bottom: 14px;
    color: #133a4f;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #35606f;
    margin: 10px 0 5px;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e1ecef;
    border-radius: 10px;
    font-size: 0.95rem;
    color: #133a4f;
    background: #f9fcfd;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #0f8080; background: #fff; }
  textarea { resize: vertical; min-height: 50px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  @media (max-width: 640px) {
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }

  .montos-rapidos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .monto-btn {
    flex: 1 1 auto; min-width: 56px; padding: 8px 6px;
    border: 2px solid #cfe6e6; border-radius: 8px; background: #eefaf9;
    color: #0f8080; font-weight: 700; font-size: 0.82rem; cursor: pointer;
  }
  .monto-btn.activo, .monto-btn:hover { background: #0f8080; color: #fff; border-color: #0f8080; }

  .oculto { display: none !important; }

  .msi-box {
    margin-top: 10px; padding: 10px 12px; background: #f4f9f8; border-radius: 10px;
  }
  .msi-check { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.82rem; color: #35606f; cursor: pointer; }
  .msi-check input { width: auto; }
  .msi-box select { margin-top: 8px; }

  button[type="submit"], .btn-primario {
    padding: 11px 18px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #1e5f8c, #0f8080); color: #fff;
    font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 16px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-secundario {
    padding: 11px 18px; border: 2px solid #cfe6e6; border-radius: 10px;
    background: #fff; color: #35606f; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 16px;
  }

  .mensaje {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 600; text-align: center; display: none;
  }
  .mensaje.exito { display: block; background: #e3f7ee; color: #157a4b; border: 2px solid #a9e6c9; }
  .mensaje.error { display: block; background: #fdecec; color: #b3261e; border: 2px solid #f5b8b4; }

  .metricas { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .metrica {
    flex: 1; min-width: 120px; background: #f8f7f4; border-radius: 10px; padding: 12px 14px;
  }
  .metrica .valor { font-size: 1.2rem; font-weight: 700; }
  .metrica .etiqueta { font-size: 0.75rem; color: #6b8794; }

  .tx-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; padding: 12px 0; border-bottom: 1px solid #eef2f3;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-desc { font-weight: 600; font-size: 0.92rem; }
  .tx-sub { font-size: 0.75rem; color: gray; margin-top: 2px; }
  .tx-nota { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .tag-msi {
    background: #EAF3DE; color: #27500A; font-size: 10px; padding: 1px 6px;
    border-radius: 4px; margin-left: 6px;
  }
  .tx-monto { text-align: right; white-space: nowrap; font-weight: 600; }
  .tx-monto.gasto { color: #E24B4A; }
  .tx-monto.ingreso { color: #639922; }
  .tx-fecha { font-size: 0.75rem; color: gray; white-space: nowrap; }
  .tx-acciones { display: flex; gap: 6px; }
  .tx-acciones button {
    border: none; background: none; cursor: pointer; font-size: 1rem; padding: 4px;
  }

  .tag-prestamo {
    display: inline-block; background: #E6F1FB; color: #0C447C; font-size: 11px;
    padding: 2px 8px; border-radius: 4px; margin-top: 6px;
  }
  .btn-abonar {
    font-size: 0.78rem; margin-left: 8px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid #0C447C; background: #fff; color: #0C447C; cursor: pointer;
  }

  .caja-edicion, .caja-abono {
    border-left: 3px solid #378ADD; padding: 12px 14px 4px; margin: 4px 0 10px;
    background: #f8fbfc; border-radius: 0 8px 8px 0;
  }

  .vacio { color: #888; font-size: 0.9rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>💳 Finanzas</h1>
  <nav>
    <a href="#" class="activo">📋 Transacciones</a>
    <a href="https://finanzas-os.streamlit.app" target="_blank" rel="noopener">
      Dashboard · Tarjetas · Préstamos · Configuración (app clásica) ↗
    </a>
  </nav>
</header>

<main>

  <section class="card">
    <h2>Nueva transacción</h2>
    <form id="form-nueva">
      <label for="n-descripcion">Descripción</label>
      <input type="text" id="n-descripcion" placeholder="Ej. Café, gasolina, súper..." required>

      <label for="n-monto">Monto</label>
      <input type="number" id="n-monto" step="0.01" min="0.01" placeholder="0.00" required>
      <div class="montos-rapidos" id="n-montos-rapidos">
        <button type="button" class="monto-btn" data-monto="50">$50</button>
        <button type="button" class="monto-btn" data-monto="100">$100</button>
        <button type="button" class="monto-btn" data-monto="500">$500</button>
        <button type="button" class="monto-btn" data-monto="1000">$1000</button>
        <button type="button" class="monto-btn" data-monto="2000">$2000</button>
      </div>

      <div class="grid2">
        <div>
          <label for="n-usuario">Usuario</label>
          <select id="n-usuario" required><option value="">Cargando...</option></select>
        </div>
        <div>
          <label for="n-tipo">Tipo</label>
          <select id="n-tipo" required>
            <option value="gasto">Gasto</option>
            <option value="ingreso">Ingreso</option>
          </select>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label for="n-categoria">Categoría</label>
          <select id="n-categoria" required><option value="">Cargando...</option></select>
        </div>
        <div>
          <label for="n-fecha">Fecha</label>
          <input type="date" id="n-fecha" required>
        </div>
      </div>

      <label for="n-medio">Medio (cuenta o tarjeta)</label>
      <select id="n-medio" required><option value="">Cargando...</option></select>

      <div id="n-msi-box" class="msi-box oculto">
        <label class="msi-check"><input type="checkbox" id="n-usar-msi"> Meses sin intereses</label>
        <select id="n-msi-meses" class="oculto">
          <option value="3">3 meses</option><option value="6">6 meses</option><option value="9">9 meses</option>
          <option value="12">12 meses</option><option value="18">18 meses</option>
          <option value="20">20 meses</option><option value="24">24 meses</option>
        </select>
      </div>

      <label for="n-notas">Notas (opcional)</label>
      <textarea id="n-notas" placeholder="Algo más que quieras anotar..."></textarea>

      <label class="msi-check" style="margin-top:14px">
        <input type="checkbox" id="n-es-prestamo"> 💸 Es préstamo o apoyo
      </label>

      <div id="n-prestamo-box" class="msi-box oculto">
        <label for="n-p-contraparte">¿Con quién?</label>
        <select id="n-p-contraparte">
          <option value="pareja">Mi pareja</option>
          <option value="externa">Persona externa</option>
        </select>
        <input type="text" id="n-p-nombre-externo" class="oculto" placeholder="Nombre (ej. Edgar, Mamá)" style="margin-top:8px">

        <label for="n-p-direccion">¿Qué pasó?</label>
        <select id="n-p-direccion">
          <option value="me_apoyan">Me van a apoyar a pagar esto</option>
          <option value="yo_pague">Yo pagué por alguien (me van a pagar)</option>
        </select>

        <label for="n-p-monto">Monto del préstamo</label>
        <input type="number" id="n-p-monto" step="0.01" min="0.01" placeholder="0.00">
        <div class="montos-rapidos" id="n-p-montos-rapidos">
          <button type="button" class="monto-btn n-p-monto-btn" data-modo="completo">Completo</button>
          <button type="button" class="monto-btn n-p-monto-btn" data-modo="mitad">La mitad</button>
        </div>

        <label for="n-p-forma-pago">¿Cómo van a pagar?</label>
        <select id="n-p-forma-pago">
          <option value="unico">Un solo pago</option>
          <option value="abonos">Abonos libres</option>
          <option value="msi" id="n-p-opcion-msi">Conforme a MSI</option>
        </select>
      </div>

      <button type="submit" id="n-btn-guardar">Guardar transacción</button>
      <div class="mensaje" id="n-mensaje"></div>
    </form>
  </section>

  <section class="card">
    <h2>Historial</h2>

    <div class="grid3">
      <div>
        <label for="f-usuario">Usuario</label>
        <select id="f-usuario"><option value="">Todos</option></select>
      </div>
      <div>
        <label for="f-mes">Mes</label>
        <select id="f-mes"></select>
      </div>
      <div>
        <label for="f-categoria">Categoría</label>
        <select id="f-categoria"><option value="">Todas las categorías</option></select>
      </div>
    </div>
    <div class="grid3">
      <div>
        <label for="f-cuenta">Cuenta</label>
        <select id="f-cuenta"><option value="">Todas las cuentas</option></select>
      </div>
      <div>
        <label for="f-tarjeta">Tarjeta</label>
        <select id="f-tarjeta"><option value="">Todas las tarjetas</option></select>
      </div>
      <div>
        <label for="f-orden">Ordenar por</label>
        <select id="f-orden">
          <option value="reciente_agregada">Más reciente agregada</option>
          <option value="fecha_reciente">Fecha (más reciente)</option>
          <option value="fecha_antigua">Fecha (más antigua)</option>
          <option value="monto_mayor">Monto (mayor primero)</option>
          <option value="monto_menor">Monto (menor primero)</option>
          <option value="categoria_az">Categoría A→Z</option>
          <option value="usuario_az">Usuario A→Z</option>
        </select>
      </div>
    </div>

    <div id="historial-mensaje" class="mensaje" style="margin-top:14px"></div>

    <div class="metricas" id="metricas" style="margin-top:16px"></div>

    <div id="lista-transacciones"></div>
  </section>

</main>

<script src="/app/transacciones.js"></script>
</body>
</html>
